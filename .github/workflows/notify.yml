name: 配膳お知らせ通知

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  issues: write
  contents: write

concurrency:
  group: haizen-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 通知チェック
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/notify.mjs

      - name: 送信済みログをコミット
        run: |
          if ! git diff --quiet -- notified.json; then
            git config user.name "haizen-notify-bot"
            git config user.email "actions@users.noreply.github.com"
            git add notified.json
            git commit -m "chore: update notified log"
            git push
          fi
